#############################
###    shared settings    ###
#############################
x-watchtower-common: &watchtower-common
  image: containrrr/watchtower:latest
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  restart: unless-stopped


##############################
###   Container Services   ###
##############################
services:
  # Watchtower instance for hrcnthu account
  watchtower-hrcnthu:
    <<: [*watchtower-common]
    container_name: watchtower-hrcnthu
    env_file:
      - config/watchtower.hrcnthu.env
    command: --interval 300 --cleanup --include-restarting --scope hrcnthu

  # Watchtower instance for pomelo925 account
  watchtower-pomelo925:
    <<: [*watchtower-common]
    container_name: watchtower-pomelo925
    env_file:
      - config/watchtower.pomelo925.env
    command: --interval 300 --cleanup --include-restarting --scope pomelo925

  # Watchtower instance for third account (example)
  # watchtower-account3:
  #   <<: [*watchtower-common]
  #   container_name: watchtower-account3
